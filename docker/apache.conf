# DerpPic Apache settings

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Helper files aren't pages; don't let anyone hit them directly.
<FilesMatch "^(config|layout|lib)\.php$">
    Require all denied
</FilesMatch>

# Full-size originals are served straight from the media folder.
Alias /media /srv/media
<Directory /srv/media>
    Options -Indexes -FollowSymLinks -ExecCGI
    AllowOverride None
    Require all granted
    # Never run anything in the media folder, only serve image files.
    php_admin_flag engine off
    <FilesMatch "(?i)\.(jpe?g|png|gif|webp)$">
        Header set Cache-Control "public, max-age=604800"
        Header set X-Content-Type-Options "nosniff"
    </FilesMatch>
    <FilesMatch "(?i)^(?!.*\.(jpe?g|png|gif|webp)$).*$">
        Require all denied
    </FilesMatch>
</Directory>

# Hide dotfiles everywhere (.git, .htaccess, hidden folders...).
<LocationMatch "/\.">
    Require all denied
</LocationMatch>

ErrorDocument 403 /error.php
ErrorDocument 404 /error.php
ErrorDocument 500 /error.php

<Location />
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
</Location>

<Location /assets>
    Header set Cache-Control "public, max-age=604800"
</Location>
